# spring.application.name=railway-ticketing
spring:
  application:
    name: railway-ticketing

  datasource:
    url: jdbc:mysql://localhost:3306/railway_ticketing?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
#  sql:
#    init:
#      mode: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

#logging:
#  level:
#    root: INFO
#    com.lhkeeper.ticketing.railway_ticketing: DEBUG
#    com.baomidou.mybatisplus: INFO
#    org.mybatis: DEBUG

jwt:
  secret: ${JWT_SECRET:railway-ticketing-secret-key-2026}
  expiration: ${JWT_EXPIRATION:86400}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl